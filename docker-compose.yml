version: "3.9"

services:
  api:
    build: .
    container_name: sovereign-brain-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sovereign-brain-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: sovereign-brain-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
